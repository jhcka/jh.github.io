---
layout: default
---
<div class="reading-column">
  <header class="page-heading">
    {% if page.eyebrow %}<p class="fn-eyebrow">{{ page.eyebrow | escape }}</p>{% endif %}
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="lede">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</div>
