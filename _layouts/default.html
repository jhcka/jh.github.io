<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/mountain-mark.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body class="fn-page">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="fn-shell">
    <header class="fn-top{% if page.url == '/' %} fn-top--home{% endif %}">
      {% if page.url == '/' %}
      <div class="home-intro">
        <h1>{{ site.title | escape }}</h1>
        <p>{{ site.description | escape }}</p>
      </div>
      {% else %}
      <a class="fn-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <img class="brand-mark" src="{{ '/assets/mountain-mark.svg' | relative_url }}" width="30" height="30" alt="">
      </a>
      {% endif %}
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>归档</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>{{ site.title | escape }}</span>
      <a href="{{ site.repository_url | escape }}">GitHub <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
</body>
</html>
